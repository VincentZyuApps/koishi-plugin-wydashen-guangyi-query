<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>网易国服 Sky 光遇 - 游戏ID查询方法</title>
<style>
  @font-face {
    font-family: 'LXGWWenKaiMono';
    src: url('fonts/LXGWWenKaiMono-Regular.ttf') format('truetype');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'LXGWWenKaiMono', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    background: #f5f6fa;
    width: 450px;
    margin: 0 auto;
    padding: 12px;
  }
  .title {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #2d3436;
    margin-bottom: 6px;
    padding: 8px;
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.12), rgba(118, 75, 162, 0.12));
    border-radius: 10px;
    border: 2px solid rgba(102, 126, 234, 0.3);
  }
  .subtitle {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: #636e72;
    margin-bottom: 4px;
  }
  .card {
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
    border-radius: 10px;
    padding: 8px 10px;
    width: 91%;
    margin: 0 auto 6px;
    border: 2px solid rgba(102, 126, 234, 0.3);
  }
  .step-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .step-number {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 11px;
    font-weight: 700;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .step-title {
    font-size: 16px;
    font-weight: 600;
    color: #2d3436;
  }
  .step-desc {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: #2d3436;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .step-img {
    display: block;
    width: 88%;
    max-width: 333px;
    border-radius: 6px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    margin: 0 auto 3px;
  }
  .tip {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: #667eea;
    line-height: 1.3;
  }
  .footer {
    text-align: center;
    font-size: 13px;
    color: #999;
    padding: 6px;
  }
</style>
</head>
<body>

<div class="title">✨ 网易国服 Sky 光遇 - 游戏ID查询方法</div>
<div class="subtitle">📱 获取游戏ID的三个步骤</div>

<div class="card">
  <div class="step-header">
    <span class="step-number">1</span>
    <span class="step-title">打开游戏设置 ⚙️</span>
  </div>
  <div class="step-desc">在游戏内点击右上角的"齿轮图标"（设置按钮）</div>
  <img class="step-img" src="step1.png" alt="步骤1">
  <div class="tip">💡 提示：齿轮图标位于游戏界面的右上角</div>
</div>

<div class="card">
  <div class="step-header">
    <span class="step-number">2</span>
    <span class="step-title">选择"精灵"选项 🎧</span>
  </div>
  <div class="step-desc">在设置菜单中，右划选择"精灵"选项</div>
  <img class="step-img" src="step2.png" alt="步骤2">
  <div class="tip">💡 提示：头像是个耳机的那个，不要和音频设置搞混了</div>
</div>

<div class="card">
  <div class="step-header">
    <span class="step-number">3</span>
    <span class="step-title">查看游戏ID 🔍</span>
  </div>
  <div class="step-desc">点击"查询ID"按钮，即可看到你的游戏ID</div>
  <img class="step-img" src="step3.png" alt="步骤3">
  <div class="tip">💡 然后长按复制这个ID，用于查询你的光翼收集情况</div>
</div>

<div class="footer">✨ 祝你在光遇世界中收集到所有光翼！✨</div>

</body>
</html>
