name: Build Go Renderer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 判断是否需要构建 / 发布 ──────────────────────────────
  check:
    name: Check commit message
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.flags.outputs.should_build }}
      should_release: ${{ steps.flags.outputs.should_release }}
      version: ${{ steps.flags.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse commit message
        id: flags
        run: |
          MSG="${{ github.event.head_commit.message }}"
          
          # 从 package.json 提取版本号（根目录的 package.json）
          VERSION="v$(cat package.json | grep '"version"' | head -1 | sed 's/.*: "\(.*\)".*/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"
          
          # PR 始终构建
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "should_build=true"    >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # "build go release" = 构建 + GitHub Release
          if echo "$MSG" | grep -qi "build go release"; then
            echo "should_build=true"    >> "$GITHUB_OUTPUT"
            echo "should_release=true"  >> "$GITHUB_OUTPUT"
          # "build go action" = 仅构建
          elif echo "$MSG" | grep -qi "build go action"; then
            echo "should_build=true"    >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false"   >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 多平台构建 ───────────────────────────────────────────
  build:
    name: Build Go Renderer
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: go/go.sum

      - name: Build all platforms
        working-directory: ./go
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GIT_COMMIT="${{ github.sha }}"
          GIT_COMMIT_SHORT="${GIT_COMMIT:0:7}"
          
          LDFLAGS="-s -w -X main.Version=$VERSION -X main.BuildTime=$BUILD_TIME -X main.GitCommit=$GIT_COMMIT_SHORT"
          
          echo "📦 Building version: $VERSION"
          echo "🕐 Build time: $BUILD_TIME"
          echo "📝 Git commit: $GIT_COMMIT_SHORT"
          
          mkdir -p ../bin
          
          echo "🔨 Building linux/amd64..."
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o ../bin/wing-renderer-linux-amd64-$VERSION .
          
          echo "🔨 Building linux/arm64..."
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o ../bin/wing-renderer-linux-arm64-$VERSION .
          
          echo "🔨 Building darwin/amd64..."
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o ../bin/wing-renderer-darwin-amd64-$VERSION .
          
          echo "🔨 Building darwin/arm64..."
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o ../bin/wing-renderer-darwin-arm64-$VERSION .
          
          echo "🔨 Building windows/amd64..."
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o ../bin/wing-renderer-windows-amd64-$VERSION.exe .
          
          echo "✅ All platforms built!"
          ls -la ../bin/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wing-renderer-${{ needs.check.outputs.version }}
          path: bin/wing-renderer-*

  # ── 发布到 GitHub Releases ─────────────────────────────
  release:
    name: Publish Release
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: wing-renderer-${{ needs.check.outputs.version }}
          path: ./artifacts

      - name: List downloaded files
        run: |
          echo "Downloaded artifacts:"
          ls -lh ./artifacts/

      - name: Delete existing release & tag (force fresh release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          echo "🗑️ Cleaning up existing release/tag: $VERSION"
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || echo "No existing release to delete"
          sleep 3

      - name: Generate release notes
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          
          # 查找上一个 release tag（排除当前版本）
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -1)
          
          {
            echo "## 🚀 Wing Renderer ${VERSION}"
            echo ""
            echo "光遇国服光翼查询 Go 渲染器"
            echo ""
            echo "### 📦 下载说明"
            echo ""
            echo "请根据您的操作系统和架构选择对应的二进制文件："
            echo ""
            echo "| 平台 | 架构 | 文件名 |"
            echo "|------|------|--------|"
            echo "| Linux | x64 | \`wing-renderer-linux-amd64-${VERSION}\` |"
            echo "| Linux | ARM64 | \`wing-renderer-linux-arm64-${VERSION}\` |"
            echo "| macOS | Intel | \`wing-renderer-darwin-amd64-${VERSION}\` |"
            echo "| macOS | Apple Silicon | \`wing-renderer-darwin-arm64-${VERSION}\` |"
            echo "| Windows | x64 | \`wing-renderer-windows-amd64-${VERSION}.exe\` |"
            echo ""
            echo "### 🔧 使用方法"
            echo ""
            echo "\`\`\`bash"
            echo "chmod +x wing-renderer-linux-amd64-${VERSION}"
            echo "echo '{\"roleId\":\"xxx\",\"wingBuffs\":[],\"wingMap\":[],\"config\":{}}' | ./wing-renderer-linux-amd64-${VERSION}"
            echo ""
            echo "# 查看版本信息"
            echo "./wing-renderer-linux-amd64-${VERSION} --version"
            echo "\`\`\`"
            echo ""
            echo "### What's Changed"
            echo ""
          
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since **${PREV_TAG}**:"
              echo ""
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (\`%h\`)" --reverse | head -20
            else
              echo "Initial release"
            fi
          
            echo ""
            echo ""
            echo "---"
            echo ""
            echo "### 📊 Build Info"
            echo "- **Build date**: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- **Commit**: [\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})"
          } > release_notes.md
          
          echo "📝 Generated release notes:"
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          gh release create "$VERSION" \
            --title "Wing Renderer ${VERSION}" \
            --notes-file release_notes.md \
            --latest \
            ./artifacts/wing-renderer-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
